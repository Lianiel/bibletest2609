<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026年9月每日活水聖經複習測驗</title>
  <meta name="description" content="　">
  <meta property="og:title" content="2026年9月每日活水聖經複習測驗">
  <meta property="og:description" content="　">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bibletest2609.vercel.app/">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="browser-prompt" class="browser-prompt hidden" role="dialog" aria-modal="true" aria-labelledby="browser-prompt-title">
    <div class="browser-prompt-card">
      <h2 id="browser-prompt-title">請使用手機預設瀏覽器開啟</h2>
      <p>為了讓測驗操作更順暢，請使用手機的 Safari、Chrome 或其他預設瀏覽器開啟。</p>
      <div class="browser-prompt-actions">
        <button id="open-default-browser" class="primary-button" type="button">使用預設瀏覽器</button>
      </div>
    </div>
  </div>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">每日活水經文複習測驗</p>
      <h1><span class="month-title">2026年9月</span><span class="range-title">《列王紀上7～11章》</span></h1>
    </header>

    <section id="start-panel" class="panel">
      <button id="start-button" class="primary-button">開始測驗</button>
    </section>

    <section id="quiz-panel" class="hidden">
      <div class="quiz-toolbar">
        <div class="progress-block"><span>題號</span><strong id="progress-label">1 / 50</strong></div>
        <div id="score-block" class="score-block"><div class="score-correct"><span>答對</span><strong id="correct-count">0</strong></div><div class="score-wrong"><span>答錯</span><strong id="wrong-count">0</strong></div></div>
      </div>
      <form id="quiz-form"></form>
      <div id="actions" class="actions">
        <button id="previous-button" class="secondary-button" type="button">上一題</button>
        <button id="next-button" class="primary-button" type="button">下一題</button>
        <button id="submit-button" class="primary-button hidden" type="button">交卷並查看結果</button>
        <button id="new-test-button" class="secondary-button hidden" type="button">開始下一次50題</button>
      </div>
    </section>

    <section id="result-panel" class="panel hidden">
      <h2 id="result-title">測驗完成</h2>
      <p id="result-summary"></p>
      <div id="result-details"></div>
    </section>
  </main>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
